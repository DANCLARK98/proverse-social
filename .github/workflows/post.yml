name: Post due carousels

on:
  schedule:
    # Fixed times (UTC) just after the 12:30 UK slot, for both BST (11:30 UTC) and GMT (12:30 UTC),
    # plus catch-ups. GitHub throttles frequent schedules; fixed times run far more reliably.
    - cron: "34 11 * * *"
    - cron: "47 11 * * *"
    - cron: "34 12 * * *"
    - cron: "47 12 * * *"
    - cron: "17 14 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: post-carousels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post anything due (Instagram + Facebook)
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          CAROUSEL_PUBLIC_BASE: https://danclark98.github.io/proverse-social/media
        run: python3 tools/post_carousels.py --go
      - name: Save the updated queue
        run: |
          if ! git diff --quiet carousel-plan.csv; then
            git config user.name "proverse-poster"
            git config user.email "actions@users.noreply.github.com"
            git add carousel-plan.csv
            git commit -m "Update posting queue"
            git pull --rebase && git push
          fi
